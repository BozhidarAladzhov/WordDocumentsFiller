
server.address=0.0.0.0
server.port=8080
server.ssl.key-store=file:C:/WordDocumentsFiller/config/worddocs-ssl.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=worddocs

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false


spring.web.resources.static-locations=classpath:/static/
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

logging.level.org.springframework=INFO

spring.datasource.url=jdbc:mysql://localhost:3306/worddocs?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=2605
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.show-sql=true

libreoffice.sofficePath=C:\\Program Files\\LibreOffice\\program\\soffice.exe
offer.output-dir=target/generated

# Microsoft Graph / Outlook mail
microsoft.graph.enabled=${MS_GRAPH_ENABLED:false}
microsoft.graph.tenant-id=${MS_GRAPH_TENANT_ID:}
microsoft.graph.client-id=${MS_GRAPH_CLIENT_ID:}
microsoft.graph.client-secret=${MS_GRAPH_CLIENT_SECRET:}
microsoft.graph.redirect-uri=${MS_GRAPH_REDIRECT_URI:http://localhost:8080/microsoft/graph/callback}
microsoft.graph.scopes=openid offline_access User.Read Mail.Send

# Local storage for Canadian vehicle payment orders. Point this to a folder inside OneDrive if desired.
canada.payment-orders.storage-dir=U:/Bojidar/FreelineData/payment-orders

# Gmail SMTP for Canadian vehicle payment orders
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_SMTP_USERNAME:}
spring.mail.password=${GMAIL_SMTP_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

canada.payment-orders.mail.enabled=${CANADA_PAYMENT_ORDERS_MAIL_ENABLED:}
canada.payment-orders.mail.to=${CANADA_PAYMENT_ORDERS_MAIL_TO:}
canada.payment-orders.mail.cc=${CANADA_PAYMENT_ORDERS_MAIL_CC:}
canada.payment-orders.mail.from-address=${CANADA_PAYMENT_ORDERS_MAIL_FROM:}
canada.payment-orders.mail.subject-template=${CANADA_PAYMENT_ORDERS_MAIL_SUBJECT_TEMPLATE:Payment orders - {vehicle} - VIN {vin}}
