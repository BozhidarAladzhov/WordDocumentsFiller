<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Canada Vehicles</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <style>
        .canada-vehicles-add-row {
            display: flex;
            justify-content: center;
            margin: 10px 0 18px;
        }

        .canada-vehicles-filter-card,
        .canada-vehicles-telegram-card {
            margin-bottom: 18px;
        }

        .canada-vehicles-filter-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            align-items: end;
        }

        .canada-vehicles-filter-form .field {
            min-width: 0;
        }

        .canada-vehicles-filter-form label {
            display: block;
            margin-bottom: 6px;
            font-size: .82rem;
            font-weight: 700;
        }

        .canada-vehicles-filter-form input {
            width: 100%;
            min-height: 40px;
            padding: 7px 10px;
            box-sizing: border-box;
        }

        .canada-vehicles-filter-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .canada-vehicles-filter-summary {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: .88rem;
        }

        .canada-vehicles-telegram-box {
            width: 100%;
            min-height: 320px;
            resize: vertical;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            box-sizing: border-box;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            line-height: 1.45;
            white-space: pre-wrap;
        }

        .canada-vehicles-telegram-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .canada-vehicles-telegram-head {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .canada-vehicles-count-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 30px;
            padding: 0 10px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface-2);
            color: var(--text);
            font-size: .84rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .canada-vehicles-telegram-hint {
            margin: 0;
            color: var(--muted);
            font-size: .86rem;
        }

        .canada-vehicles-add-btn {
            min-width: 220px;
            height: 48px;
            padding: 0 22px;
            font-size: 1rem;
            border-radius: 14px;
            box-shadow: 0 12px 28px rgba(22, 163, 74, .28);
        }

        .canada-vehicles-dialog-form {
            display: grid;
            gap: 8px;
        }

        .canada-vehicles-dialog-form .field {
            min-width: 0;
        }

        .canada-vehicles-dialog-form label {
            margin-top: 0;
            margin-bottom: 3px;
            font-size: .82rem;
        }

        .canada-vehicles-dialog-form .field input,
        .canada-vehicles-dialog-form .field select {
            width: 100%;
            margin-top: 0;
            min-height: 40px;
            height: 40px;
            padding: 7px 10px;
            font-size: .92rem;
            box-sizing: border-box;
        }

        .canada-vehicles-dialog-form select.pill {
            padding-top: 0;
            padding-bottom: 0;
            line-height: 1.2;
        }

        .canada-vehicles-dialog {
            max-width: min(560px, calc(100vw - 24px));
        }

        .canada-vehicles-dialog .fleet-modal__content {
            padding: 12px;
        }

        .canada-vehicles-dialog .fleet-section-head {
            margin-bottom: 8px;
        }

        .canada-vehicles-dialog .details-footer {
            margin-top: 10px !important;
            gap: 8px;
        }

        .canada-vehicles-dialog .btn-sm {
            height: 34px;
            padding: 0 10px;
            border-radius: 10px;
        }

        .canada-vehicles-table th,
        .canada-vehicles-table td {
            font-size: .92rem;
            text-align: center;
            vertical-align: middle;
        }

        .canada-vehicles-table td > * {
            margin-left: auto;
            margin-right: auto;
        }

        .canada-vehicles-table .btn-sm--ghost,
        .canada-vehicles-table .container-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            text-decoration: none;
            font-size: .92rem;
            font-weight: 700;
            line-height: 1;
        }

        .canada-vehicles-table .btn-sm--ghost:hover,
        .canada-vehicles-table .container-link:hover {
            background: var(--surface-2);
            border-color: #9fc8d2;
        }

        .canada-vehicles-table .container-link {
            color: var(--brand);
        }

        .canada-vehicles-table .container-link .kbd,
        .canada-vehicles-table .btn-sm--ghost .kbd {
            padding: 0;
            border: 0;
            background: transparent;
            color: inherit;
            font: inherit;
        }

        .canada-vehicles-table .kbd {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--text);
            font: inherit;
        }

        .canada-vehicles-notes-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 56px;
            min-height: 34px;
            padding: 0 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            font-size: .88rem;
            font-weight: 700;
        }

        .canada-vehicles-notes-btn:hover {
            background: var(--surface-2);
            border-color: #9fc8d2;
        }

        .canada-vehicles-notes-btn__icon {
            width: 14px;
            height: 14px;
            display: inline-block;
        }

        .canada-vehicles-notes-btn__count {
            min-width: 10px;
        }

        .canada-vehicles-notes-preview {
            margin: 0;
            white-space: pre-wrap;
            color: var(--text);
            font-size: .92rem;
            line-height: 1.45;
        }

        .canada-vehicles-shell {
            width: calc(100vw - 10px) !important;
            max-width: calc(100vw - 10px) !important;
            margin: 14px auto 0 !important;
            padding: 20px 8px !important;
        }

        .canada-vehicles-card {
            width: 100%;
            margin-left: 0;
            margin-right: 0;
        }

        .canada-vehicles-shell .table-wrap {
            width: 100%;
        }

        .canada-vehicles-mail-cell {
            display: grid;
            gap: 4px;
            justify-items: center;
        }

        .canada-vehicles-mail-meta {
            font-size: .78rem;
            color: var(--muted);
            line-height: 1.25;
        }
    </style>
</head>
<body>
<div th:replace="fragments/navbar :: main-nav"></div>

<div class="container tools tracker tracker--wide canada-vehicles-shell">
    <div class="tracker-topbar">
        <div>
            <h1 class="tracker-title">Canada Vehicles</h1>
        </div>
    </div>

    <div class="canada-vehicles-add-row">
        <button type="button"
                class="btn-sm btn-sm--save canada-vehicles-add-btn"
                onclick="openCanadaVehicleAddDialog()">Add Vehicle</button>
    </div>

    <div class="card canada-vehicles-filter-card">
        <h2 style="margin-top:0;">Payment Date Filter</h2>
        <form method="get" th:action="@{/canada-vehicles}" class="canada-vehicles-filter-form">
            <div class="field">
                <label for="paymentDate">Exact Payment Date</label>
                <input id="paymentDate" name="paymentDate" type="date" th:value="${paymentDate}">
            </div>
            <div class="field">
                <label for="paymentDateFrom">From</label>
                <input id="paymentDateFrom" name="paymentDateFrom" type="date" th:value="${paymentDateFrom}">
            </div>
            <div class="field">
                <label for="paymentDateTo">To</label>
                <input id="paymentDateTo" name="paymentDateTo" type="date" th:value="${paymentDateTo}">
            </div>
            <div class="canada-vehicles-filter-actions">
                <button type="submit" class="btn-sm btn-sm--save">Filter</button>
                <a th:href="@{/canada-vehicles}" class="btn-sm btn-sm--ghost">Clear</a>
            </div>
        </form>
        <p class="canada-vehicles-filter-summary" th:if="${paymentDateFilterActive}"
           th:text="|Found ${#lists.size(vehicles)} row(s) with payment date for the selected filter.|"></p>
    </div>

    <div class="card canada-vehicles-telegram-card" th:if="${paymentDateFilterActive}">
        <div class="canada-vehicles-telegram-actions">
            <div class="canada-vehicles-telegram-head">
                <h2 style="margin:0;">Sorted</h2>
                <span class="canada-vehicles-count-badge"
                      th:text="|${#lists.size(vehicles)} rows|"></span>
            </div>
            <button type="button" class="btn-sm btn-sm--ghost" onclick="copyCanadaVehiclesTelegramText()">Copy Text</button>
        </div>
        <textarea id="canadaVehiclesTelegramText"
                  class="canada-vehicles-telegram-box"
                  readonly
                  th:text="${telegramPaymentText}"></textarea>
    </div>

    <div class="card canada-vehicles-card">
        <h2 style="margin-top:0;">All Vehicles</h2>

        <div class="table-wrap">
            <table class="table canada-vehicles-table">
                <thead>
                <tr>
                    <th>Client</th>
                    <th>Notes</th>
                    <th>Vehicle</th>
                    <th>VIN</th>
                    <th>Container</th>
                    <th>ETA</th>
                    <th>Талон</th>
                    <th>Invoice</th>
                    <th>Amount</th>
                    <th>Payment Date</th>
                    <th>Payment Orders</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(vehicles)}">
                    <td colspan="11">No vehicles added yet.</td>
                </tr>
                <tr th:each="v : ${vehicles}"
                    class="js-open-details-row"
                    th:attr="data-details-url=@{/canada-vehicles/{id}(id=${v.id})}">
                    <td>
                        <a class="btn-sm btn-sm--ghost"
                           th:href="@{/canada-vehicles/{id}(id=${v.id})}"
                           th:text="${v.clientName != null && !#strings.isEmpty(v.clientName) ? v.clientName : 'Open'}">
                            Open
                        </a>
                    </td>
                    <td>
                        <button th:if="${v.notes != null && !#strings.isEmpty(#strings.trim(v.notes))}"
                                type="button"
                                class="canada-vehicles-notes-btn"
                                th:attr="onclick=|openCanadaVehicleNotesDialog('canadaVehicleNotesDialog_${v.id}')|">
                            <svg class="canada-vehicles-notes-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <span class="canada-vehicles-notes-btn__count">1</span>
                        </button>
                        <span th:if="${v.notes == null || #strings.isEmpty(#strings.trim(v.notes))}">-</span>
                        <dialog th:id="${'canadaVehicleNotesDialog_' + v.id}" class="fleet-modal">
                            <div class="fleet-modal__content">
                                <div class="fleet-section-head">
                                    <h2 style="margin:0;">Notes Preview</h2>
                                    <button type="button" class="btn-ghost" th:attr="onclick=|closeCanadaVehicleNotesDialog('canadaVehicleNotesDialog_${v.id}')|">Close</button>
                                </div>
                                <p class="canada-vehicles-notes-preview" th:text="${v.notes}"></p>
                            </div>
                        </dialog>
                    </td>
                    <td th:text="${v.vehicleName}"></td>
                    <td><span class="kbd" th:text="${v.vin}"></span></td>
                    <td>
                        <a th:if="${v.trackingLink != null && !#strings.isEmpty(v.trackingLink)}"
                           class="container-link"
                           th:href="${v.trackingLink}"
                           target="_blank"
                           rel="noopener noreferrer">
                            <span class="kbd" th:text="${v.containerNo}"></span>
                        </a>
                        <span th:if="${v.trackingLink == null || #strings.isEmpty(v.trackingLink)}"
                              class="kbd"
                              th:text="${v.containerNo}"></span>
                    </td>
                    <td th:text="${v.eta != null ? #temporals.format(v.eta, 'dd.MM.yyyy') : ''}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${v.talonStatus != null && v.talonStatus.name() == 'RECEIVED' ? ' good' : ' bad'}"
                              th:text="${v.talonStatus}"></span>
                    </td>
                    <td th:text="${v.invoiceNumber}"></td>
                    <td th:text="${v.amount != null ? v.amount + ' USD' : ''}"></td>
                    <td th:text="${v.paymentDate != null ? #temporals.format(v.paymentDate, 'dd.MM.yyyy') : ''}"></td>
                    <td>
                        <div class="canada-vehicles-mail-cell" th:if="${v.paymentOrdersSentAt != null}">
                            <span class="badge good">SENT</span>
                            <span class="canada-vehicles-mail-meta"
                                  th:text="${#temporals.format(v.paymentOrdersSentAt, 'dd.MM.yyyy HH:mm')}"></span>
                        </div>
                        <span th:if="${v.paymentOrdersSentAt == null}" class="badge bad">NOT SENT</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<dialog id="canadaVehicleAddDialog" class="fleet-modal canada-vehicles-dialog">
    <div class="fleet-modal__content">
        <div class="fleet-section-head">
            <h2 style="margin:0;">Add Vehicle</h2>
            <button type="button" class="btn-ghost" onclick="closeCanadaVehicleAddDialog()">Close</button>
        </div>

        <form th:action="@{/canada-vehicles}" method="post" th:object="${newVehicle}" class="details-form canada-vehicles-dialog-form">
            <div class="field">
                <label>Client</label>
                <input th:field="*{clientName}">
            </div>

            <div class="field">
                <label>Vehicle</label>
                <input th:field="*{vehicleName}">
            </div>

            <div class="field">
                <label>VIN</label>
                <input th:field="*{vin}">
            </div>

            <div class="field">
                <label>Container</label>
                <input th:field="*{containerNo}">
            </div>

            <div class="field">
                <label>ETA</label>
                <input type="date" th:field="*{eta}">
            </div>

            <div class="field">
                <label>Талон</label>
                <select th:field="*{talonStatus}" class="pill">
                    <option th:each="status : ${talonStatusOptions}" th:value="${status}" th:text="${status}"></option>
                </select>
            </div>

            <div class="field">
                <label>Invoice</label>
                <input th:field="*{invoiceNumber}">
            </div>

            <div class="field">
                <label>Amount (USD)</label>
                <input type="number" step="0.01" th:field="*{amount}">
            </div>

            <div class="field">
                <label>Payment Date</label>
                <input type="date" th:field="*{paymentDate}">
            </div>

            <div class="field">
                <label>Tracking Link</label>
                <input th:field="*{trackingLink}" placeholder="https://...">
            </div>

            <div class="details-footer" style="margin-top:14px;">
                <button type="button" class="btn-sm btn-sm--ghost" onclick="closeCanadaVehicleAddDialog()">Cancel</button>
                <button type="submit" class="btn-sm btn-sm--save">Add Vehicle</button>
            </div>
        </form>
    </div>
</dialog>

<script th:src="@{/js/app.js}" src="/js/app.js"></script>
<script>
    function openCanadaVehicleAddDialog() {
        const dialog = document.getElementById("canadaVehicleAddDialog");
        if (dialog && typeof dialog.showModal === "function") dialog.showModal();
    }

    function closeCanadaVehicleAddDialog() {
        const dialog = document.getElementById("canadaVehicleAddDialog");
        if (dialog) dialog.close();
    }

    function openCanadaVehicleNotesDialog(id) {
        const dialog = document.getElementById(id);
        if (dialog && typeof dialog.showModal === "function") dialog.showModal();
    }

    function closeCanadaVehicleNotesDialog(id) {
        const dialog = document.getElementById(id);
        if (dialog) dialog.close();
    }

    async function copyCanadaVehiclesTelegramText() {
        const field = document.getElementById("canadaVehiclesTelegramText");
        if (!field) return;

        field.select();
        field.setSelectionRange(0, field.value.length);

        try {
            await navigator.clipboard.writeText(field.value);
        } catch (error) {
            document.execCommand("copy");
        }
    }
</script>
</body>
</html>
