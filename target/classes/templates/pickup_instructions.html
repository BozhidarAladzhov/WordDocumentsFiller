<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Instructions USA</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>

<body>
<div th:replace="fragments/navbar :: main-nav"></div>


    <div class="container">
        <h1>Инструкции за вътрешен транспорт в САЩ</h1>

        <form onsubmit="return false;">
            <div class="grid">
                <div>
                    <label>Place</label>
                    <select id="place" onchange="handlePlaceChange()">
                        <option value="Copart">Copart</option>
                        <option value="IAAI">IAAI</option>
                        <option value="Private address">Private address</option>
                    </select>
                </div>

                <div>
                    <label>Vehicle</label>
                    <input type="text" id="vehicle" />
                </div>

                <div>
                    <label>VIN</label>
                    <input type="text" id="vin" />
                </div>

                <div id="lotStockWrap">
                    <label id="lotStockLabel">LOT</label>
                    <input type="text" id="lotStockValue" />
                </div>

                <!-- PIN WRAP -->
                <div id="pinWrap">
                    <label id="pinLabel">GATE PASS PIN</label>
                    <input type="text" id="pinValue" />
                </div>

                <div>
                    <label id="locationLabel">Location</label>
                    <input type="text" id="locationValue" />
                </div>

                <div id="privateFields" class="hidden" style="grid-column: 1 / -1;">
                    <div class="grid">
                        <div>
                            <label>Contact</label>
                            <input type="text" id="contact" />
                        </div>
                        <div>
                            <label>Phone number</label>
                            <input type="text" id="phone" />
                        </div>
                        <div style="grid-column: 1 / -1;">
                            <label>Items in the car</label>
                            <select id="itemsInCar">
                                <option value="Yes">Yes</option>
                                <option value="No">No</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div>
                    <label>To terminal</label>
                    <input type="text" id="toTerminal" />
                </div>

                <div style="grid-column: 1 / -1;">
                    <label>Special requirements</label>
                    <textarea id="specialReq"></textarea>
                </div>
            </div>

            <div class="btn-row">
                <button onclick="generateText()">Generate</button>
                <button class="btn-secondary" onclick="copyGeneratedText()">Copy</button>
                <button class="btn-ghost" onclick="resetForm()">Reset</button>
            </div>
        </form>

        <div id="resultBox" class="resultBox">
            <p id="resultText"></p>
            <div class="hint">Copy: Viber-friendly text is generated so bold formatting is preserved on paste.</div>
            <div id="copiedToast" class="copied">✅ Copied!</div>
        </div>

        <textarea id="plainTextOut" style="position:absolute; left:-9999px;"></textarea>
        <div id="richCopyOut" contenteditable="true" style="position:absolute; left:-9999px; top:-9999px; white-space:pre-wrap;"></div>
    </div>

    <script>
        function escapeHtml(str) {
            return String(str || "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function addInstructionLine(linesHtml, linesText, icon, label, value) {
            const safeValue = value || "";
            linesHtml.push(`${icon} <strong>${escapeHtml(label)}:</strong> ${escapeHtml(safeValue)}<br>`);
            linesText.push(`${icon} *${label}:* ${safeValue}\n`);
        }

        function buildTexts(data) {
            const linesHtml = [];
            const linesText = [];

            linesHtml.push(`<strong>${escapeHtml(data.place)}</strong><br>`);
            linesText.push(`*${data.place}*\n`);

            addInstructionLine(linesHtml, linesText, "\uD83D\uDE98", "Vehicle", data.vehicle);
            addInstructionLine(linesHtml, linesText, "\uD83C\uDFAB", "VIN", data.vin);

            if (data.place !== "Private address") {
                addInstructionLine(linesHtml, linesText, "\uD83D\uDD0E", data.lotStockLabel, data.lotStockValue);
                if (data.pinValue) {
                    addInstructionLine(linesHtml, linesText, "\uD83D\uDD0E", data.pinLabel, data.pinValue);
                }
            }

            addInstructionLine(
                linesHtml,
                linesText,
                data.place === "Private address" ? "\uD83C\uDFE0" : "\uD83D\uDCCD",
                data.locationLabel,
                data.locationValue
            );

            if (data.place === "Private address") {
                addInstructionLine(linesHtml, linesText, "\uD83D\uDC64", "Contact", data.contact);
                addInstructionLine(linesHtml, linesText, "\uD83D\uDCDE", "Phone", data.phone);
                addInstructionLine(linesHtml, linesText, "\uD83D\uDCE6", "Items in the car", data.itemsInCar);
            }

            addInstructionLine(linesHtml, linesText, "\uD83D\uDD4B", "To terminal", data.toTerminal);
            addInstructionLine(linesHtml, linesText, "\uD83D\uDCCB", "Special requirements", data.specialReq || "None");

            const bodyHtml = linesHtml.join("");
            const previewHtml = `<div style="font-family:Arial, Helvetica, sans-serif; font-size:14px; line-height:1.5; color:#111827;">${bodyHtml}</div>`;
            const copyHtml = `<div style="font-family:Arial, Helvetica, sans-serif; font-size:14px; line-height:1.5; color:#111827;">${bodyHtml}</div>`;
            return { html: previewHtml, copyHtml: copyHtml, text: linesText.join("") };
        }

        function handlePlaceChange() {
            const place = document.getElementById("place").value;

            document.getElementById("lotStockWrap").classList.toggle("hidden", place === "Private address");
            document.getElementById("pinWrap").classList.toggle("hidden", place === "Private address");
            document.getElementById("privateFields").classList.toggle("hidden", place !== "Private address");

            document.getElementById("lotStockLabel").textContent = place === "IAAI" ? "STOCK" : "LOT";
            document.getElementById("pinLabel").textContent = place === "IAAI" ? "PICK UP PIN" : "GATE PASS PIN";
            document.getElementById("locationLabel").textContent = place === "Private address" ? "Address" : "Location";
        }

        function generateText() {
            const place = document.getElementById("place").value;

            const built = buildTexts({
                place,
                vehicle: vehicle.value,
                vin: vin.value,
                lotStockLabel: lotStockLabel.textContent,
                lotStockValue: lotStockValue.value,
                pinLabel: pinLabel.textContent,
                pinValue: pinValue.value,
                locationLabel: locationLabel.textContent,
                locationValue: locationValue.value,
                contact: contact.value,
                phone: phone.value,
                itemsInCar: itemsInCar.value,
                toTerminal: toTerminal.value,
                specialReq: specialReq.value
            });

            resultText.innerHTML = built.html;
            richCopyOut.innerHTML = built.copyHtml;
            plainTextOut.value = built.text;
            resultBox.style.display = "block";
            copiedToast.style.display = "none";
        }

        async function copyGeneratedText() {
            if (resultBox.style.display !== "block") generateText();

            const text = plainTextOut.value || "";

            await window.copyToClipboard({
                text,
                fallbackTextarea: plainTextOut
            });
            copiedToast.style.display = "block";
            setTimeout(() => copiedToast.style.display = "none", 1500);
        }

        function resetForm() {
            document.querySelector("form").reset();
            resultBox.style.display = "none";
            handlePlaceChange();
        }

        handlePlaceChange();
    </script>
    <script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>
