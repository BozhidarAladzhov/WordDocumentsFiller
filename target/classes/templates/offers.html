<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <title>Оферти за транспорт</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>

<body>
<div th:replace="fragments/navbar :: main-nav"></div>



    <div class="container">
        <h1>Избери категория и дестинация за оферта за транспорт.</h1>

        <div class="grid">
            <!-- Автомобили -->
            <section class="card">
                <h2>Автомобили</h2>
                <div class="btn-row">
                    <a class="btn" href="/form/NL/vehicles">Оферта с POD Netherlands</a>
                    <a class="btn alt" href="/form/BG/vehicles">Оферта с POD Bulgaria</a>
                </div>
            </section>

            <!-- Мотоциклети -->
            <section class="card">
                <h2>Мотоциклети</h2>
                <div class="btn-row">
                    <a class="btn" href="/form/NL/motorcycles">Оферта с POD Netherlands</a>
                    <a class="btn alt" href="/form/BG/motorcycles">Оферта с POD Bulgaria</a>
                </div>
            </section>

            <!-- 50% LCL -->
            <section class="card">
                <h2>50% LCL</h2>
                <div class="btn-row">
                    <a class="btn" href="/form/NL/HLCL">Оферта с POD Netherlands</a>
                    <a class="btn alt" href="/form/BG/HLCL">Оферта с POD Bulgaria</a>
                </div>
            </section>

            <!-- FCL -->
            <section class="card">
                <h2>FCL</h2>
                <div class="btn-row">
                    <a class="btn" href="/form/NL/FCL">Оферта с POD Netherlands</a>
                    <a class="btn alt" href="/form/BG/FCL">Оферта с POD Bulgaria</a>
                </div>
            </section>
        </div>

    </div>
    <script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>
